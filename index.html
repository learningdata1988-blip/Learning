<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Hub</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--border:#334155;--accent:#38bdf8}
@media (prefers-color-scheme: light){:root{--bg:#f8fafc;--panel:#fff;--text:#0f172a;--muted:#475569;--border:#cbd5e1;--accent:#0369a1}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:48px 16px}
h1{margin:0 0 8px;font-size:2rem}
p.sub{color:var(--muted);margin:0 0 32px}
ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
a.card{display:block;padding:18px 20px;background:var(--panel);border:1px solid var(--border);border-radius:12px;color:var(--text);text-decoration:none;transition:border-color .15s,transform .15s}
a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
a.card b{display:block;color:var(--accent);font-size:1.15rem}
a.card span{color:var(--muted);font-size:.92rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>Learning Hub</h1>
  <p class="sub">Study guides and reference notes.</p>
  <ul>
    <li><a class="card" href="https://learningdata1988-blip.github.io/Learning/pyspark.html"><b>PySpark →</b><span>Study guide &amp; reference: architecture, DataFrames, Delta, SCD, streaming, tuning.</span></a></li>
  </ul>
</div>
</body>
</html>
